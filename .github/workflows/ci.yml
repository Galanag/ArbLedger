name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile source and test suite
        run: python -m compileall -q src tests benchmarks
      - name: Ruff lint
        run: ruff check src
      - name: Ruff formatting check
        run: ruff format --check src
      - name: Mypy type checking
        run: mypy src/arbledger --ignore-missing-imports
      - name: Run test suite with branch coverage gate
        run: pytest --cov=arbledger --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Dependency vulnerability audit
        run: python -m pip install safety && safety scan --full-report
      - name: Secret scanning
        run: python scripts/secret_scan.py
