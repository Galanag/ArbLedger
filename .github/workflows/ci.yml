name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile source and test suite
        run: python -m compileall -q src tests benchmarks
      - name: Ruff lint
        run: ruff check src
      - name: Ruff formatting check
        run: ruff format --check src
      - name: Mypy type checking
        run: mypy src/arbledger --ignore-missing-imports
      - name: Run test suite with branch coverage gate
        run: pytest --cov=arbledger --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Dependency vulnerability audit
        run: python -m pip install safety && safety check --full-report
- name: Secret scanning
        run: python << 'PYEOF'
import os, re
patterns = [
    r'API_KEY\s*=\s*.{1,50}',
    r'API_SECRET\s*=\s*.{1,50}',
    r'SECRET_KEY\s*=\s*.{1,50}',
    r'PASSWORD\s*=\s*.{1,50}',
    r'TOKEN\s*=\s*.{1,50}',
]
matches = []
for root, dirs, files in os.walk('src'):
    for f in files:
        if f.endswith('.py'):
            path = os.path.join(root, f)
            with open(path) as fh:
                for i, line in enumerate(fh, 1):
                    for pat in patterns:
                        if re.search(pat, line):
                            matches.append((path, i, line.strip()))
if matches:
    for path, line_num, line in matches:
        print(f'Potential secret in {path}:{line_num}: {line}')
PYEOF
